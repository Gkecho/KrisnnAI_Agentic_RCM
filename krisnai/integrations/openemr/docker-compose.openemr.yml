# Local OpenEMR for Stage 1: the open-source EMR (7.0.3) on MariaDB. Listens on 127.0.0.1 only (http 8300, https 9300 self-signed).
# No password lives in this repo: `krisnai openemr up` generates the database and admin passwords per run into out/openemr/.
# The REST API, the FHIR API and the OAuth2 password grant are switched on here so the integration can authenticate without the admin screens.
services:
  db:
    image: mariadb:11.4
    command: ["--character-set-server=utf8mb4"]
    environment:
      MARIADB_ROOT_PASSWORD: "${KRISNAI_OPENEMR_DB_PASSWORD:?run krisnai openemr up}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 30
  openemr:
    image: openemr/openemr:7.0.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASS: "${KRISNAI_OPENEMR_DB_PASSWORD}"
      MYSQL_USER: openemr
      MYSQL_PASS: "${KRISNAI_OPENEMR_DB_PASSWORD}"
      OE_USER: admin
      OE_PASS: "${KRISNAI_OPENEMR_ADMIN_PASSWORD:?run krisnai openemr up}"
      OPENEMR_SETTING_rest_api: "1"
      OPENEMR_SETTING_rest_fhir_api: "1"
      OPENEMR_SETTING_oauth_password_grant: "3"
      OPENEMR_SETTING_site_addr_oath: "https://localhost:9300"
    ports:
      - "127.0.0.1:8300:80"
      - "127.0.0.1:9300:443"
