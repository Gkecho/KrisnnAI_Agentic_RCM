# Local SQL Server for inspecting the canonical data model (synthetic data only, never real PHI).
# Start it with:  python tools/data_model/db_up.py        (creates .env.db with a generated password on first run)
# Connect from VS Code (MSSQL extension): server 127.0.0.1,14330 · user sa · database krisnnai_canonical · password in .env.db
name: krisnnai-db
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: krisnnai-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run tools/data_model/db_up.py to create .env.db}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - krisnnai_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  krisnnai_db_data:
