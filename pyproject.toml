[project]
name = "krisnnai"
version = "0.0.1"
description = "KrisnnAI RCM - intelligence layer above PM/EHR and clearinghouse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyodbc>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
valley = ["psycopg2-binary>=2.9"]

[project.scripts]
krisnnai = "krisnnai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krisnnai*"]

[tool.setuptools.package-data]
"krisnnai.metrics" = ["sql/*.sql"]
"krisnnai.integrations.fhir" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a large synthetic history (about a minute); skip with -m \"not slow\""]

[tool.ruff]
extend-exclude = ["migrations/versions", "tools/data_model"]  # generator scripts, dense by design
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"krisnnai/model/**" = ["E501"]
"migrations/**" = ["E501"]
"krisnnai/ingest/valley.py" = ["E501"]
